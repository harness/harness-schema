type: object
title: agent
additionalProperties: false
required:
  - agent
properties:
  version:
    type: number
    enum:
      - 1
  agent:
    $ref: ./agent.yaml
examples:
  - agent:
      uses: harnessAI@1.0.0
      inputs:
        test-input:
          type: string
          required: true
      with:
        connector: anthropic_bedrock_99cf4be5
        prompt: print all the available mcp for ${{inputs.test-input}}
        mcp:
          - connector_test_mcp_github
        max_turns: "150"
        env:
          ANTHROPIC_MODEL: claude-sonnet-5
$schema: http://json-schema.org/draft-07/schema#
