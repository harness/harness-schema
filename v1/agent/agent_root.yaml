type: object
title: agent
additionalProperties: false
required:
  - agent
properties:
  version:
    type: number
    enum:
      - 1
  agent:
    $ref: ./agent.yaml
examples:
  - agent:
      uses: harnessAI@1.0.0
      inputs:
        test-input:
          type: string
          required: true
      with:
        connector: account.harnessLLM
        prompt: print all the available mcp for ${{inputs.test-input}}
        mcp:
          - harnessMcp
          - Traceable
        max_turns: "150"
        env:
          ANTHROPIC_MODEL: claude-sonnet-5
  - agent:
      uses: harnessAI@1.0.0
      with:
        prompt: |-
          list available mcps
          list available pipelines in this project
          print the value of $GREET
        env:
          GREET: ${{inputs.test}}
        allowed_domains: pubmed.mcp.claude.com, api.githubcopilot.com
        max_turns: "50"
        workdir: /harness
        image: harness/harness-ai-agent:latest
        docker_connector: ${{inputs.docker.id}}
        connector: ${{inputs.llm.id}}
        mcp: ${{inputs.mcpCon}}
      inputs:
        test:
          type: string
          default: test-value
        docker:
          type: connector
          default: account.harnessImage
          ui:
            connectorCategories:
              - ARTIFACTORY
        llm:
          type: connector
          default: account.harnessLLM
          ui:
            connectorCategories:
              - AI
        mcpCon:
          type: array
          default:
            - harnessMcp
            - Traceable
          ui:
            input:
              inputType: connector
              inputConfig:
                connectorTypes:
                  - Mcp
$schema: http://json-schema.org/draft-07/schema#
