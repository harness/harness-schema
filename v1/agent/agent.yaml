title: AgentSpec
description: Custom agent document stored by ACM. The agent body is a nested reference to the harnessAI step template plus optional user-defined inputs.
type: object
additionalProperties: false
required:
  - uses
  - with
properties:
  uses:
    description: Nested harnessAI template reference (`harnessAI` or `harnessAI@<semver>`).
    type: string
    pattern: "^harnessAI(@[0-9]+\\.[0-9]+\\.[0-9]+)?$"
  with:
    $ref: ./harness-ai-with.yaml
  inputs:
    description: User-defined inputs for this agent. Keys become `${{inputs.<name>}}` in `with`.
    $ref: ../pipeline/common/ng-variable-v1-wrapper.yaml
  layout:
    description: Optional UI layout for agent inputs (same shape as v1 templates).
    type: array
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
$schema: http://json-schema.org/draft-07/schema#
