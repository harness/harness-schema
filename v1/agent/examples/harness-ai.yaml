agent:
  inputs:
    test-input:
      required: true
      type: string
  uses: harnessAI@1.0.0
  with:
    connector: account.harnessLLM
    env:
      ANTHROPIC_MODEL: claude-sonnet-5
    max_turns: "150"
    mcp:
      - harnessMcp
      - Traceable
    prompt: |
      print all the available mcp for ${{inputs.test-input}}
