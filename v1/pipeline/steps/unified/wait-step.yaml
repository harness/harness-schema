title: UnifiedWaitStepNode
description: Wait step node for pausing pipeline execution.
allOf:
  - $ref: ./abstract-step-node.yaml
  - type: object
    required:
      - wait
    properties:
      wait:
        description: Wait step configuration.
        type: object
        required:
          - duration
        properties:
          duration:
            description: Duration to wait (e.g., 10s, 5m, 1h 30m). Supports <+...> and ${{...}} expressions, runtime input and execution input.
            type: string
            pattern: ^((([1-9])+\d+[s])|((([1-9])+\d*[mhwd])+([\s]?\d+[smhwd])*)|(.*<\+.*>.*)|(.*\$\{\{.+\}\}.*))$
$schema: http://json-schema.org/draft-07/schema#
