title: UnifiedFmeChangeProposalSubmitStepNode
description: FME Change Proposal Submit step node.
allOf:
  - $ref: ./abstract-step-node.yaml
  - type: object
    required:
      - fme-change-proposal-submit
    properties:
      fme-change-proposal-submit:
        description: FME Change Proposal Submit step configuration.
        type: object
        required:
          - uses
          - with
        properties:
          uses:
            description: Embedded step handler.
            type: string
            enum:
              - harness
          with:
            description: FME Change Proposal Submit step parameters.
            type: object
            required:
              - resourceType
              - changes
            properties:
              resourceType:
                description: Type of resource the change proposal targets.
                oneOf:
                  - type: string
                    enum:
                      - configMetadata
                      - configDefinition
                  - $ref: ../../common/expression.yaml
              resourceId:
                description: Identifier of the resource the change proposal targets (UUID or ULID).
                oneOf:
                  - type: string
                    oneOf:
                      - pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
                      - pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
                  - $ref: ../../common/expression.yaml
              environment:
                description: FME environment name or identifier the change proposal applies to.
                oneOf:
                  - type: string
                    minLength: 1
                    maxLength: 100
                  - $ref: ../../common/expression.yaml
              title:
                description: Title of the change proposal.
                oneOf:
                  - type: string
                    minLength: 1
                    maxLength: 120
                  - $ref: ../../common/expression.yaml
              comment:
                description: Comment for the change proposal.
                oneOf:
                  - type: string
                    minLength: 1
                    maxLength: 480
                  - $ref: ../../common/expression.yaml
              changes:
                description: List of JSON Patch-style change operations. Value required for add/replace is enforced at runtime.
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - op
                    - path
                  properties:
                    op:
                      type: string
                      enum:
                        - add
                        - replace
                        - remove
                    path:
                      type: string
                    value: {}
                    previousValue: {}
$schema: http://json-schema.org/draft-07/schema#
