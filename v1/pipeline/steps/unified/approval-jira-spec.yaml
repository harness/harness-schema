title: UnifiedJiraApprovalStepSpec
description: Jira approval step specification.
type: object
additionalProperties: true
required:
  - approve
properties:
  retry:
    description: Retry interval for polling Jira.
    type: string
  approve:
    description: Approval criteria configuration.
    anyOf:
      - type: object
        additionalProperties: true
      - type: string
  reject:
    description: Rejection criteria configuration.
    anyOf:
      - type: object
        additionalProperties: true
      - type: string
  run:
    description: Run step configuration for script execution.
    $ref: ./run-step-info.yaml
  project:
    description: Jira project key. The fetched issue must belong to this project.
    type: string
  type:
    description: Jira issue type. The fetched issue must be of this type.
    type: string
$schema: http://json-schema.org/draft-07/schema#
