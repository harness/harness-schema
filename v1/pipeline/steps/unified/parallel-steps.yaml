title: ParallelSteps
description: Defines a list of steps to be executed in parallel.
type: object
additionalProperties: false
required:
  - parallel
properties:
  parallel:
    type: object
    additionalProperties: false
    required:
      - steps
    properties:
      steps:
        type: array
        items:
          $ref: ./step-items.yaml
  parent-template-type:
    description: Keyword of the template this step was expanded from. Stamped during template resolution.
    $ref: ../../common/parent-template-type.yaml
$schema: http://json-schema.org/draft-07/schema#

