title: TemplateRef
description: Template identifier and input configuration.
type: object
additionalProperties: false
required:
  - uses
properties:
  uses:
    description: Template identifier reference.
    type: string
  with:
    description: Template input overrides.
    $ref: ./with.yaml
  gitBranch:
    description: Git branch for remote template resolution.
    type: string
  container:
    description: >
      Caller-side container overrides merged into the resolved template step.
      Applied for any V1 step template whose spec contains run, run-test, or background
      (including git-clone and build-and-push templates that wrap those steps).
    $ref: ./template-container-overlay.yaml
$schema: http://json-schema.org/draft-07/schema#
