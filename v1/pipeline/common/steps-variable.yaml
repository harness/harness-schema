title: StepsVariable
description: Steps variable definition. The value is an array of steps.
allOf:
  - $ref: ./variable.yaml
  - type: object
    required:
      - type
    properties:
      type:
        description: Variable type.
        type: string
        enum:
          - steps
      value:
        description: Variable value. An array of steps.
        type: array
        minItems: 1
        items:
          $ref: ../steps/unified/step-items.yaml
        metadata:
          inputProperties:
            dependsOn: [ type ]
      default:
        description: Default value for the variable. An array of steps.
        type: array
        minItems: 1
        items:
          $ref: ../steps/unified/step-items.yaml
      enum:
        description: Defines a list of accepted input values.
        type: array
        items:
          type: array
          items:
            $ref: ../steps/unified/step-items.yaml
$schema: http://json-schema.org/draft-07/schema#
