title: FilterCondition
description: Filter condition for property-based filtering (e.g., tags).
type: object
properties:
  id:
    description: Unique identifier for the filter condition. Needed when a field inside the condition uses a runtime input.
    type: string
  tags:
    description: Tag-based filter conditions.
    oneOf:
      # Runtime input or expression for the condition as a whole, match type included.
      # The match type is a key (`all` / `in`) and a YAML key cannot hold an expression,
      # so templating the whole condition is how a runtime match type is expressed.
      - $ref: ../../common/expression.yaml
      # Match any of the specified tags (OR). The tags themselves may be a runtime input
      # or an expression, leaving the match type fixed.
      - type: object
        required:
          - in
        properties:
          in:
            description: Match any of the specified tags (OR). Supports a runtime input or an expression.
            anyOf:
              - type: object
                additionalProperties:
                  type: string
              - type: string
        additionalProperties: false
      # Match all of the specified tags (AND). The tags themselves may be a runtime input
      # or an expression, leaving the match type fixed.
      - type: object
        required:
          - all
        properties:
          all:
            description: Match all of the specified tags (AND). Supports a runtime input or an expression.
            anyOf:
              - type: object
                additionalProperties:
                  type: string
              - type: string
        additionalProperties: false
additionalProperties: false
$schema: http://json-schema.org/draft-07/schema#
