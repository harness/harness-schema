title: FilterCondition
description: Filter condition for property-based filtering (e.g., tags).
type: object
properties:
  tags:
    description: Tag-based filter conditions.
    oneOf:
      # Match any of the specified tags (OR). The tags themselves may be an expression,
      # leaving the match type fixed.
      #
      # The match type is a key, so it is always fixed. A runtime match type, or a runtime
      # condition, is expressed by making the whole filters block a runtime input - see
      # filters.yaml.
      - type: object
        required:
          - in
        properties:
          in:
            description: Match any of the specified tags (OR). Supports an expression.
            anyOf:
              - type: object
                additionalProperties:
                  type: string
              - type: string
        additionalProperties: false
      # Match all of the specified tags (AND). The tags themselves may be an expression,
      # leaving the match type fixed.
      - type: object
        required:
          - all
        properties:
          all:
            description: Match all of the specified tags (AND). Supports an expression.
            anyOf:
              - type: object
                additionalProperties:
                  type: string
              - type: string
        additionalProperties: false
additionalProperties: false
$schema: http://json-schema.org/draft-07/schema#
