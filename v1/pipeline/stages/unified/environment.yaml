title: EnvironmentV1
description: Environment configuration for CD stages. Single and multi environment selection always uses the items form; environment groups use the group form and filtered selections use the filters form.
oneOf:
  # Single or multi environment with items
  - type: object
    required:
      - items
    properties:
      items:
        description: List of environments for multi-environment deployment.
        $ref: ./environment-items.yaml
      parallel:
        description: Execute environments in parallel (all at once). Defaults to false, so environments run one at a time (serially) unless set to true.
        oneOf:
          - type: boolean
            default: false
          - $ref: ../../common/expression.yaml
      on-failure:
        description: Failure strategy for this environment selection. Overrides the stage-level failure strategy.
        $ref: ../../common/on-failure.yaml
    additionalProperties: false
  # Multi-environment with group
  - type: object
    required:
      - group
    properties:
      group:
        description: Environment group configuration, or an expression (e.g. <+input>).
        $ref: ./environment-group.yaml
      parallel:
        description: Execute environments in parallel (all at once). Defaults to false, so environments run one at a time (serially) unless set to true.
        oneOf:
          - type: boolean
            default: false
          - $ref: ../../common/expression.yaml
      on-failure:
        description: Failure strategy for this environment group. Overrides the stage-level failure strategy.
        $ref: ../../common/on-failure.yaml
    additionalProperties: false
  # Multi-environment with filters
  - type: object
    required:
      - filters
    properties:
      filters:
        description: Filters for selecting environments and infrastructures.
        $ref: ./filters.yaml
      parallel:
        description: Execute environments in parallel (all at once). Defaults to false, so environments run one at a time (serially) unless set to true.
        oneOf:
          - type: boolean
            default: false
          - $ref: ../../common/expression.yaml
      on-failure:
        description: Failure strategy for this environment selection. Overrides the stage-level failure strategy.
        $ref: ../../common/on-failure.yaml
    additionalProperties: false
$schema: http://json-schema.org/draft-07/schema#
