title: EnvironmentItem
description: "Single environment item configuration. Even as the sole element of a 1-element `items` list (a single environment), its own `deploy-to` count independently decides single vs multi-infra: a `deploy-to` list of 2 or more elements makes the deployment multi-infra."
type: object
required:
  - id
properties:
  id:
    description: Environment identifier.
    type: string
  ref:
    description: Git branch for the environment configuration.
    type: string
  deploy-to:
    description: Infrastructure(s) to deploy to.
    $ref: ./deploy-to.yaml
  filters:
    description: Filters for selecting infrastructures.
    $ref: ./filters.yaml
additionalProperties: false
$schema: http://json-schema.org/draft-07/schema#
