title: GroupStages
description: Group of stages executed sequentially.
type: object
additionalProperties: false
required:
  - group
properties:
  id:
    description: Unique identifier for the group.
    type: string
  name:
    description: Display name of the group.
    type: string
  group:
    description: Group configuration.
    type: object
    additionalProperties: false
    properties:
      id:
        description: Unique identifier for the group.
        type: string
      name:
        description: Display name of the group.
        type: string
      stages:
        description: Stages within the group, or an expression that resolves to an array of stages.
        oneOf:
          - type: array
            items:
              $ref: ./stage-items.yaml
            minItems: 1
          - $ref: ../../common/expression.yaml
$schema: http://json-schema.org/draft-07/schema#

