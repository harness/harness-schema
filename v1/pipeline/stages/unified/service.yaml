title: ServiceV1
description: "Service configuration for CD stages. Always uses the items form, for single and multi service alike: a fixed list of services (each an identifier, an expression, or an object with id and optional input overrides), or a single runtime input for the whole list."
type: object
required:
  - items
properties:
  type:
    description: Service swimlane hint applied to the multi-service group.
    $ref: ./service-type.yaml
  items:
    description: List of services, for single and multi service deployment alike. Can be a fixed list or a single runtime input for the whole list.
    oneOf:
      - type: array
        items:
          $ref: ./service-item.yaml
      - $ref: ../../common/expression.yaml
  parallel:
    description: Execute services in parallel (all at once). Defaults to false, so services run one at a time (serially) unless set to true.
    oneOf:
      - type: boolean
        default: false
      - $ref: ../../common/expression.yaml
  on-failure:
    description: Failure strategy for this service group. Overrides the stage-level failure strategy.
    $ref: ../../common/on-failure.yaml
additionalProperties: false
$schema: http://json-schema.org/draft-07/schema#
