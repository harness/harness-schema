title: ServiceV1
description: "Service configuration for CD stages. Supports multiple formats. Single vs multi-service is decided by the actual resolved count of the `items` array, not by whether `items` is present: a 1-element list is a single service (an expression is allowed as that sole element), 2 or more elements is a multi-service group (which must be an all-fixed list, or a single runtime input for the whole list)."
oneOf:
  # Single service as a bare identifier string (or runtime input)
  - type: string
    description: Service identifier reference.
  # Single service object: { type?, id, ref?, with? }
  - type: object
    required:
      - id
    properties:
      type:
        description: Service swimlane hint for the single service.
        $ref: ./service-type.yaml
      id:
        description: Service identifier.
        type: string
      ref:
        description: Git branch for the service configuration.
        type: string
      with:
        description: Service input overrides.
        $ref: ../../common/with.yaml
    additionalProperties: false
  # Multi-service with items: { type?, items, parallel? }
  - type: object
    required:
      - items
    properties:
      type:
        description: Service swimlane hint applied to the multi-service group.
        $ref: ./service-type.yaml
      items:
        description: "List of services. Single vs multi-service is decided by the actual element count (1 element = single, 2+ = multi), not by the presence of this field. Can be a fixed list or a single runtime input for the whole list; an individual element cannot itself be a literal runtime-input placeholder (<+input>)."
        oneOf:
          - type: array
            items:
              $ref: ./service-item.yaml
          - $ref: ../../common/expression.yaml
      parallel:
        description: Execute services in parallel (all at once). Defaults to false, so services run one at a time (serially) unless set to true.
        oneOf:
          - type: boolean
            default: false
          - $ref: ../../common/expression.yaml
    additionalProperties: false
$schema: http://json-schema.org/draft-07/schema#
