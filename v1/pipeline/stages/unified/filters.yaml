title: Filters
description: Filters for selecting environments or infrastructures.
type: array
items:
  type: object
  required:
    - id
  properties:
    id:
      description: Unique identifier for the filter. Required on every filter, so that run form and input set references stay stable when filters are reordered or deleted.
      type: string
    infrastructures:
      description: Infrastructure filters.
      oneOf:
        # "all" - select all infrastructures
        - type: string
          enum:
            - all
        # Direct list of conditions (OR)
        - type: array
          items:
            $ref: ./filter-condition.yaml
        # Map with or/and operators
        - type: object
          properties:
            or:
              type: array
              items:
                $ref: ./filter-condition.yaml
            and:
              type: array
              items:
                $ref: ./filter-condition.yaml
          additionalProperties: false
    environments:
      description: Environment filters.
      oneOf:
        # "all" - select all environments
        - type: string
          enum:
            - all
        # Direct list of conditions (OR)
        - type: array
          items:
            $ref: ./filter-condition.yaml
        # Map with or/and operators
        - type: object
          properties:
            or:
              type: array
              items:
                $ref: ./filter-condition.yaml
            and:
              type: array
              items:
                $ref: ./filter-condition.yaml
          additionalProperties: false
  additionalProperties: false
$schema: http://json-schema.org/draft-07/schema#
