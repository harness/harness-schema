title: FeatureFlagsStageNodeV1
description: Feature Flags stage node for FME pipeline execution.
type: object
additionalProperties: false
required:
  - feature-flags
properties:
  id:
    description: Unique identifier for the stage.
    type: string
  name:
    description: Display name of the stage.
    type: string
  feature-flags:
    description: Feature Flags stage configuration.
    type: object
    additionalProperties: false
    required:
      - steps
    properties:
      steps:
        description: Steps within the Feature Flags stage.
        type: array
        items:
          $ref: ../../steps/unified/step-items.yaml
        minItems: 1
$schema: http://json-schema.org/draft-07/schema#
