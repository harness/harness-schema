title: RuntimeV1
description: Runtime execution engine configuration. Either a string shorthand (cloud|shell|vm|k8) or an object carrying one of the runtime specs.
$schema: http://json-schema.org/draft-07/schema#
oneOf:
  # String shorthand — handled by RuntimeV1Deserializer.
  - type: string
    enum:
      - cloud
      - shell
      - vm
      - k8
      - delegate
  # Object form — mirrors io.harness.beans.yaml.extended.runtime.V1.RuntimeV1 fields.
  - type: object
    additionalProperties: false
    properties:
      shell:
        description: Shell runtime specification.
        $ref: ./runtime_shell.yaml
      cloud:
        description: Cloud runtime specification.
        $ref: ./runtime_cloud.yaml
      vm:
        description: VM runtime specification.
        $ref: ./runtime_vm.yaml
      kubernetes:
        description: Kubernetes runtime specification.
        $ref: ./runtime_kubernetes.yaml
      delegate:
        description: Delegate selectors for this runtime. Supports expressions. With kubernetes and no kubernetes.connector, the selected delegates provide the cluster credentials (inherit from delegate) and delegate is required.
        $ref: ../../common/delegate.yaml
    # kubernetes without a connector inherits credentials from the delegate, so delegate becomes mandatory.
    if:
      required:
        - kubernetes
      properties:
        kubernetes:
          not:
            required:
              - connector
    then:
      required:
        - delegate
