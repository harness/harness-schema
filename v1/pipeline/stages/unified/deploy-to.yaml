title: DeployTo
description: "Infrastructure deployment target configuration. Single vs multi-infra is decided by the actual resolved count, not by the shape used: a scalar id, a single infra object, or a 1-element list are all single-infra; 2 or more elements (or the dynamic `all` marker, see the DeployToAll design) is multi-infra. A literal runtime-input placeholder (<+input>) is not supported as an individual list element."
oneOf:
  # Single infra (string or object)
  - $ref: ./infra-item.yaml
  # Array of infras
  - type: array
    items:
      $ref: ./infra-item.yaml
$schema: http://json-schema.org/draft-07/schema#
