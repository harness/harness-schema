title: NotificationEvent
description: NotificationEvent defines event types that trigger notifications.
type: object
additionalProperties: false
properties:
  pipeline:
    description: Pipeline-level events.
    oneOf:
      - type: string
        enum:
          - all
          - start
          - success
          - failed
          - end
          - paused
          - waiting-for-user-action
          - resumed
      - type: array
        items:
          type: string
          enum:
            - all
            - start
            - success
            - failed
            - end
            - paused
            - waiting-for-user-action
            - resumed
  stage:
    description: Stage-level events.
    oneOf:
      - type: string
        enum:
          - all
          - start
          - success
          - failed
      - type: array
        items:
          oneOf:
            - type: string
              enum:
                - all
                - start
                - success
                - failed
            - type: object
              properties:
                all:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                start:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                success:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                failed:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
              minProperties: 1
              maxProperties: 1
  step:
    description: Step-level events.
    oneOf:
      - type: string
        enum:
          - failed
      - type: array
        items:
          oneOf:
            - type: string
              enum:
                - failed
            - type: object
              properties:
                failed:
                  description: "Steps to notify on: all, one step FQN (for example stage1.group1.step1), or a list of step FQNs."
                  oneOf:
                    - type: string
                      minLength: 1
                    - type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
              required:
                - failed
              minProperties: 1
              maxProperties: 1
              additionalProperties: false
  trigger:
    description: Trigger-level events.
    oneOf:
      - type: string
        enum:
          - failed
      - type: array
        items:
          type: string
          enum:
            - failed
$schema: http://json-schema.org/draft-07/schema#

