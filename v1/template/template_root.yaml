type: object
title: template
additionalProperties: false
required:
  - template
properties:
  version:
    type: number
    enum:
      - 1
  template:
    type: object
    # Keep open so template metadata (alias, layout, author, module, version, etc.)
    # and future fields are not rejected on save.
    additionalProperties: true
    properties:
      id:
        type: string
        description: Unique identifier of the template.
        pattern: "^[a-zA-Z_][0-9a-zA-Z_]{0,127}$"
      name:
        type: string
        description: Display name of the template.
        pattern: "^[a-zA-Z_0-9-.][-0-9a-zA-Z_\\s.]{0,127}$"
      description:
        type: string
        description: Description of the template.
      tags:
        type: object
        description: Tags for the template.
        additionalProperties:
          type: string
      inputs:
        description: >-
          Template inputs. Open object so extended types (choice, list, connector),
          UI metadata, and expression-based required/visible are allowed.
        type: object
        additionalProperties: true
    oneOf:
      - required:
          - pipeline
        properties:
          pipeline:
            $ref: ../pipeline/pipeline.yaml
      - required:
          - stage
        properties:
          stage:
            $ref: ../pipeline/stages/unified/unified-stage.yaml
      - required:
          - step
        properties:
          step:
            $ref: ../pipeline/steps/unified/step-items.yaml
      - required:
          - group
        properties:
          group:
            $ref: ./group/group-body.yaml
      - required:
          - agent
        properties:
          agent:
            description: >-
              Deprecated: define a step template with `template.step.agent.uses`/`with`
              instead of a top-level `template.agent` entity.
            $ref: ./agent/agent-body.yaml
$schema: http://json-schema.org/draft-07/schema#
