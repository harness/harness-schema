      field:
        type: string
        minLength: 1
      op:
        type: string
        enum:
          - eq
          - ne
      value:
        oneOf:
          - type: string
          - type: number
          - type: boolean
  - type: object
    additionalProperties: false
    required:
      - field
      - op
      - value
    properties:
      field:
        type: string
        minLength: 1
      op:
        type: string
        enum:
          - in
          - notIn
      value:
        type: array
        minItems: 1
        items:
          oneOf:
            - type: string
            - type: number
            - type: boolean
  - type: object
    additionalProperties: false
    required:
      - field
      - op
    properties:
      field:
        type: string
        minLength: 1
      op:
        type: string
        enum:
          - isEmpty
          - isNotEmpty
$schema: http://json-schema.org/draft-07/schema#
