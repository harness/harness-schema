title: StoPolicyEnforcementStepInfo
allOf:
- $ref: ../../common/step-spec-type.yaml
- type: object
  required:
  - policySetIds
  properties:
    policySetIds:
      oneOf:
      - type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
    orgId:
      oneOf:
      - $ref: string-without-jexl.yaml
      - $ref: common-jexl.yaml
    projectId:
      oneOf:
      - $ref: string-without-jexl.yaml
      - $ref: common-jexl.yaml
    policy_enforcement_execution_id:
      type: string
    targetName:
      type: string
    targetVariant:
      type: string
    productName:
      type: string
$schema: http://json-schema.org/draft-07/schema#
