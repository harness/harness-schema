title: CdStoPolicyEnforcementStepInfo
allOf:
- $ref: ../../common/step-spec-type.yaml
- type: object
  required:
  - policySetIds
  - infrastructure
  properties:
    policySetIds:
      oneOf:
      - type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
    policy_enforcement_execution_id:
      type: string
    targetName:
      type: string
    targetVariant:
      type: string
    productName:
      type: string
    infrastructure:
      oneOf:
      - $ref: container-k8s-infra.yaml
      - $ref: container-ecs-infra.yaml
$schema: http://json-schema.org/draft-07/schema#
