title: ContainerInfraYamlSpec
type: object
required:
- connectorRef
properties:
  annotations:
    oneOf:
    - type: object
      additionalProperties:
        type: string
    - type: string
  automountServiceAccountToken:
    oneOf:
    - type: boolean
    - type: string
      pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
      minLength: 1
  connectorRef:
    type: string
  containerSecurityContext:
    oneOf:
    - $ref: ../../steps/custom/security-context.yaml
    - type: string
      pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
      minLength: 1
  initTimeout:
    type: string
  labels:
    oneOf:
    - type: object
      additionalProperties:
        type: string
    - type: string
  namespace:
    type: string
    minLength: 1
    maxLength: 2147483647
  nodeSelector:
    oneOf:
    - type: object
      additionalProperties:
        type: string
    - type: string
      pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
      minLength: 1
  os:
    oneOf:
    - type: string
      enum:
      - Linux
      - MacOS
      - Windows
    - type: string
      pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
      minLength: 1
  priorityClassName:
    type: string
  resources:
    $ref: ../../common/container-resource.yaml
  runAsUser:
    oneOf:
    - type: integer
      format: int32
    - type: string
  serviceAccountName:
    type: string
  tolerations:
    oneOf:
    - type: array
      items:
        $ref: ../../steps/custom/toleration.yaml
    - type: string
      pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
      minLength: 1
  useRunner:
    description: "When true, routes CD container step-group init/execute via the runner even if CDS_CONTAINER_STEP_GROUP_STEPS_USE_RUNNER is disabled. Combined with the FF as OR. Applies to KubernetesDirect step-group infra only; ECS always uses runner."
    type: boolean
  volumes:
    oneOf:
    - type: array
      items:
        $ref: container-volume.yaml
    - type: string
      pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
      minLength: 1
  description:
    desc: This is the description for ContainerInfraYamlSpec
$schema: http://json-schema.org/draft-07/schema#
