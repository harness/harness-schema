title: FmeChangeProposalSubmitStepInfo
allOf:
  - $ref: ../../common/step-spec-type.yaml
  - type: object
    required:
      - resourceType
      - changes
    properties:
      resourceType:
        oneOf:
          - $ref: ../common/fme-change-proposal-common-resource-type.yaml
          - $ref: ../common/common-jexl.yaml
      resourceId:
        oneOf:
          - $ref: ../common/fme-change-proposal-common-resource-id.yaml
          - $ref: ../common/common-jexl.yaml
      environmentId:
        description: "Environment identifier. Mandatory when resourceType is configDefinition"
        oneOf:
          - $ref: ../common/fme-change-proposal-common-resource-id.yaml
          - $ref: ../common/common-jexl.yaml
      changes:
        oneOf:
          - type: array
            items:
              $ref: ../common/fme-change-proposal-common-change.yaml
            minItems: 1
      title:
        oneOf:
          - $ref: ../common/fme-change-proposal-common-title.yaml
      comment:
        oneOf:
          - $ref: ../common/fme-change-proposal-common-comment.yaml
  - if:
      properties:
        resourceType:
          const: configDefinition
    then:
      required:
        - environmentId
      properties:
        changes:
          type: array
          items:
            $ref: ../common/fme-change-proposal-common-change-config-definition.yaml
  - if:
      properties:
        resourceType:
          const: configMetadata
    then:
      properties:
        changes:
          type: array
          items:
            $ref: ../common/fme-change-proposal-common-change-config-metadata.yaml
$schema: http://json-schema.org/draft-07/schema#
