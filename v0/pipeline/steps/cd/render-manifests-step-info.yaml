title: RenderManifestsStepInfo
allOf:
- $ref: ../../common/step-spec-type.yaml
- type: object
  required:
  - tool
  - outPath
  properties:
    tool:
      oneOf:
      - type: string
        enum:
        - Helm
        - Kustomize
        - HarnessNative
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
    path:
      type: string
      minLength: 1
    outPath:
      type: string
      minLength: 1
    clearTargetPath:
      description: "Remove existing contents of outPath before rendering. Default: true"
      oneOf:
      - type: boolean
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
    splitResources:
      description: "Write one file per rendered resource instead of one consolidated file. Default: false"
      oneOf:
      - type: boolean
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
    helm:
      type: object
      properties:
        releaseName:
          type: string
        namespace:
          type: string
        valuesFiles:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        ignoreMissingValueFiles:
          oneOf:
          - type: boolean
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        values:
          type: string
        setValues:
          oneOf:
          - type: array
            items:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
                literal:
                  oneOf:
                  - type: boolean
                  - type: string
                    pattern: (<\+.+>.*)
                    minLength: 1
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        includeCRDs:
          oneOf:
          - type: boolean
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        disableHooks:
          oneOf:
          - type: boolean
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        skipTests:
          oneOf:
          - type: boolean
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        buildDependencies:
          oneOf:
          - type: boolean
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        useReleaseName:
          oneOf:
          - type: boolean
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        kubeVersion:
          type: string
        apiVersions:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        registryConnectors:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        initScript:
          type: string
    kustomize:
      type: object
      properties:
        images:
          oneOf:
          - type: array
            items:
              type: object
              properties:
                name:
                  type: string
                newName:
                  type: string
                newTag:
                  type: string
                digest:
                  type: string
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        namespace:
          type: string
        namePrefix:
          type: string
        nameSuffix:
          type: string
        replicas:
          oneOf:
          - type: array
            items:
              type: object
              properties:
                name:
                  type: string
                count:
                  oneOf:
                  - type: integer
                    format: int32
                  - type: string
                    pattern: (<\+.+>.*)
                    minLength: 1
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        kubeVersion:
          type: string
        apiVersions:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        initScript:
          type: string
    harnessNative:
      type: object
      properties: {}
