title: RenderManifestsStepInfo
allOf:
- $ref: ../../common/step-spec-type.yaml
- type: object
  required:
  - tool
  - path
  - outPath
  properties:
    tool:
      oneOf:
      - type: string
        enum:
        - Helm
        - Kustomize
      - type: string
        pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
        minLength: 1
    path:
      type: string
      minLength: 1
    outPath:
      type: string
    clearTargetPath:
      description: "Remove existing contents of outPath before rendering. Default: true"
      oneOf:
      - type: boolean
      - type: string
        pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
        minLength: 1
    helm:
      type: object
      properties:
        releaseName:
          type: string
        valuesFiles:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
        flags:
          type: string
        registryConnectorRef:
          type: string
        initScript:
          type: string
    kustomize:
      type: object
      properties:
        flags:
          type: string
        registryConnectorRef:
          type: string
        initScript:
          type: string
