title: InheritRuleOverride
type: object
required:
  - listenerRuleArn
properties:
  listenerRuleArn:
    type: string
    pattern: ^(?=\s*\S).*$
  weightPercentage:
    oneOf:
      - type: integer
        format: int32
        minimum: 0
        maximum: 100
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
  description:
    type: string
    desc: This is the description for InheritRuleOverride
$schema: http://json-schema.org/draft-07/schema#
