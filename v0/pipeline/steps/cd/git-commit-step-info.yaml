title: GitCommitStepInfo
allOf:
- $ref: ../../common/step-spec-type.yaml
- type: object
  required:
    - directory
  properties:
    connectorRef:
      type: string
    directory:
      type: string
    message:
      type: string
    branch:
      type: string
    noChangesAction:
      oneOf:
        - type: string
          enum:
            - skip
            - fail
        - type: string
          pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
          minLength: 1
    authorName:
      type: string
    authorEmail:
      type: string
    push:
      oneOf:
        - type: boolean
        - type: string
          pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
          minLength: 1
    forcePush:
      oneOf:
        - type: boolean
        - type: string
          pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
          minLength: 1
