title: AzureRepoStore
allOf:
- $ref: store-config.yaml
- type: object
  required:
  - connectorRef
  - gitFetchType
  properties:
    branch:
      type: string
    commitId:
      type: string
    connectorRef:
      type: string
    folderPath:
      type: string
    gitFetchType:
      oneOf:
      - type: string
        enum:
        - Branch
        - Commit
      - type: string
        pattern: "(<\\+.+>.*)"
        minLength: 1
    paths:
      oneOf:
      - type: array
        items:
          type: string
      - type: string
        pattern: "(<\\+.+>.*)"
        minLength: 1
    repoName:
      type: string
- oneOf:
  - required:
    - folderPath
  - required:
    - paths
$schema: http://json-schema.org/draft-07/schema#
properties:
  description:
    desc: This is the description for AzureRepoStore
