title: SyncStepInfo
$ref: ../../common/step-spec-type.yaml
type: object
required:
  - applyOnly
  - dryRun
  - forceApply
  - prune
  - syncOptions
properties:
  applicationsList:
    oneOf:
      - type: array
        items:
          $ref: agent-application-targets.yaml
      - type: string
        pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
        minLength: 1
  applicationRegex:
    type: string
  applicationLabels:
    oneOf:
      - type: array
        items:
          type: string
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
  applyOnly:
    oneOf:
    - type: boolean
    - type: string
  delegateSelectors:
    oneOf:
      - type: array
        items:
          type: string
      - type: string
        pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
        minLength: 1
  dryRun:
    oneOf:
      - type: boolean
      - type: string
  forceApply:
    oneOf:
      - type: boolean
      - type: string
  prune:
    oneOf:
      - type: boolean
      - type: string
  resourcesFilter:
    $ref: resources-filter.yaml
  retryStrategy:
    $ref: sync-retry-strategy.yaml
  syncOptions:
    $ref: sync-options.yaml
  waitTillHealthy:
    oneOf:
      - type: boolean
      - type: string
  failOnTimeout:
    oneOf:
      - type: boolean
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
  showResourceProgress:
    oneOf:
      - type: boolean
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
  autoPromoteRolloutBehavior:
    oneOf:
      - type: string
        enum:
          - promote-full
          - resume
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
  degradedStateTimeout:
    type: string
    pattern: ^(([1-9])+\d+[s])|(((([1-9])+\d*[mhwd])+([\s]?\d+[smhwd])*)|(.*<\+.*>(?!.*\.executionInput\(\)).*)|(^$))$
  successCriteria:
    oneOf:
      - type: string
        enum:
          - syncInitiated
          - syncSucceeded
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
$schema: http://json-schema.org/draft-07/schema#
allOf:
  - dependencies:
      failOnTimeout: [ waitTillHealthy ]
      degradedStateTimeout: [ waitTillHealthy ]
  # syncInitiated does not poll the sync operation, so polling-only options are rejected.
  # Only literal values are checked here; runtime inputs and expressions are validated during execution.
  - if:
      required:
        - successCriteria
      properties:
        successCriteria:
          const: syncInitiated
    then:
      properties:
        waitTillHealthy:
          not:
            const: true
        failOnTimeout:
          not:
            const: true
        showResourceProgress:
          not:
            const: true
        autoPromoteRolloutBehavior:
          not:
            enum:
              - promote-full
              - resume
        degradedStateTimeout:
          not:
            pattern: ^\d
  - anyOf:
      - oneOf:
          - required:
              - applicationsList
          - required:
              - applicationRegex
          - required:
              - applicationLabels
      - not:
          anyOf:
            - required:
                - applicationsList
            - required:
                - applicationRegex
            - required:
                - applicationLabels