title: GitOpsRollbackStepInfo
$ref: ../../common/step-spec-type.yaml
type: object
required:
  - applicationsList
properties:
  applicationsList:
    oneOf:
      - type: array
        items:
          $ref: agent-application-rollback-targets.yaml
      - type: string
        pattern: ^<\+input>((\.)((executionInput\(\))|(allowedValues|selectOneFrom|selectManyFrom|default|regex)\(.+?\)))*$
        minLength: 1
  rollBackSteps:
    oneOf:
      - type: integer
        minimum: 1
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
  prune:
    oneOf:
      - type: boolean
      - type: string
  waitTillHealthy:
    oneOf:
      - type: boolean
      - type: string
  failOnTimeout:
    oneOf:
      - type: boolean
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
  successCriteria:
    oneOf:
      - type: string
        enum:
          - syncInitiated
          - syncSucceeded
      - type: string
        pattern: (<\+.+>.*)
        minLength: 1
$schema: http://json-schema.org/draft-07/schema#
allOf:
  - dependencies:
      failOnTimeout: [ waitTillHealthy ]
  # syncInitiated does not poll the sync operation, so polling-only options are rejected.
  # Only literal values are checked here; runtime inputs and expressions are validated during execution.
  - if:
      required:
        - successCriteria
      properties:
        successCriteria:
          const: syncInitiated
    then:
      properties:
        waitTillHealthy:
          not:
            enum:
              - true
              - "true"
        failOnTimeout:
          not:
            const: true
