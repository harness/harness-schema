$schema: http://json-schema.org/draft-07/schema#
title: K8sTrafficRoutingSpec
type: object
required:
  - provider
  - spec
properties:
  provider:
    type: string
    enum:
      - istio
      - gateway
  spec:
    type: object
allOf:
  - if:
      properties:
        provider:
          const: istio
    then:
      properties:
        spec:
          $ref: k8s-istio-provider-spec.yaml
  - if:
      properties:
        provider:
          const: gateway
    then:
      properties:
        spec:
          $ref: k8s-gateway-provider-spec.yaml