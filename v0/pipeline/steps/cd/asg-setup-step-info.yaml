title: AsgSetupStepInfo
allOf:
  - $ref: ../../common/step-spec-type.yaml
  - type: object
    required:
      - asgName
      - resizeStrategy
      - instances
    properties:
      asgName:
        type: string
      deleteOldAsg:
        oneOf:
          - type: boolean
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
      delegateSelectors:
        oneOf:
          - type: array
            items:
              type: string
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
      instances:
        $ref: asg-instances.yaml
      resizeStrategy:
        oneOf:
          - type: string
            enum:
              - resize_new_first
              - downsize_old_first
          - type: string
            pattern: (<\+.+>.*)
            minLength: 1
    if:
      properties:
        deleteOldAsg:
          const: true
      required:
        - deleteOldAsg
    then:
      properties:
        resizeStrategy:
          oneOf:
            - const: resize_new_first
            - type: string
              pattern: (<\+.+>.*)
              minLength: 1
      required:
        - resizeStrategy
