title: AisreCreateIncidentStepInfo
allOf:
  - $ref: ../../common/step-spec-type.yaml
  - type: object
    required:
      - title
      - severity
      - service
    properties:
      title:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      orgIdentifier:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      projectIdentifier:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      incidentType:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      severity:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      status:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      service:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      environment:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      description:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      commanderHarnessUserId:
        oneOf:
          - $ref: ../common/string-without-jexl.yaml
          - $ref: ../common/common-jexl.yaml
      labels:
        description: Incident labels
        oneOf:
          - type: array
            items:
              type: string
          - $ref: ../common/common-jexl.yaml
      attachPipelineContext:
        oneOf:
          - type: boolean
          - $ref: ../common/common-jexl.yaml
      autoAssignOnCall:
        oneOf:
          - type: boolean
          - $ref: ../common/common-jexl.yaml
      additionalImpactedServices:
        description: Additional impacted Harness service identifiers
        oneOf:
          - type: array
            items:
              type: string
          - $ref: ../common/common-jexl.yaml
      fields:
        description: Incident-type specific fields keyed by field identifier
        oneOf:
          - type: object
            additionalProperties:
              type: string
          - $ref: ../common/common-jexl.yaml
$schema: http://json-schema.org/draft-07/schema#
