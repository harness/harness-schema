title: ApiTestRunStepInfo
allOf:
- $ref: ci-step-info.yaml
- type: object
  properties:
    collectionName:
      description: "Name of the API testing collection to run (the server creates the run from this)"
      oneOf:
      - type: string
        minLength: 1
        not:
          pattern: "^<\\+.*>.*$"
      - $ref: ../common/common-jexl.yaml
    environmentName:
      description: "Optional environment name to use for the run (falls back to the collection's default environment)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    runId:
      description: "Pre-created test run ID (low-level/back-compat mode; maps to PLUGIN_RUN_ID)"
      oneOf:
      - type: string
        minLength: 1
        not:
          pattern: "^<\\+.*>.*$"
      - $ref: ../common/common-jexl.yaml
    baseUrl:
      description: "Fully-scoped API Testing server URL including account/org/project path (low-level mode; maps to PLUGIN_BASE_URL)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    token:
      description: "Callback token authorizing the plugin to call back to the server (low-level mode; maps to PLUGIN_TOKEN)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    junitOutputPath:
      description: "Optional path to write a JUnit XML report (maps to PLUGIN_JUNIT_OUTPUT_PATH)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    aiEnabled:
      description: "Enable AI assertions for this run; must equal \"true\" to turn the judge on (maps to PLUGIN_AI_ENABLED)"
      oneOf:
      - type: boolean
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    aiWireFormat:
      description: "LLM gateway wire format, openai or anthropic (maps to PLUGIN_AI_WIRE_FORMAT)"
      oneOf:
      - type: string
        enum: [openai, anthropic]
      - $ref: ../common/common-jexl.yaml
    aiProvider:
      description: "AI sub-provider, e.g. anthropic/openai/bedrock/gemini (maps to PLUGIN_AI_PROVIDER)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    aiModel:
      description: "Model string, e.g. claude-sonnet-4-5 (maps to PLUGIN_AI_MODEL)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    aiTimeoutMs:
      description: "Per-judge timeout in milliseconds (maps to PLUGIN_AI_TIMEOUT_MS)"
      oneOf:
      - type: integer
        minimum: 1
      - $ref: ../common/common-jexl.yaml
    aiMaxJudgeBody:
      description: "Max response-body characters sent to the judge (maps to PLUGIN_AI_MAX_JUDGE_BODY)"
      oneOf:
      - type: integer
        minimum: 1
      - $ref: ../common/common-jexl.yaml
    aiPromptVersion:
      description: "Judge prompt version (maps to PLUGIN_AI_PROMPT_VERSION)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    aiAuthSource:
      description: "Gateway credential source: leave unset for the managed-connector worker path (UC3); set to 'pat' only in devspace (UC2). Maps to PLUGIN_AI_AUTH_SOURCE"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    aiGatewayBaseUrl:
      description: "UC2 (devspace) only: LLM gateway base URL (maps to PLUGIN_AI_GATEWAY_BASE_URL)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
    aiGatewayApiKey:
      description: "UC2 (devspace) only: LLM gateway PAT/SAT sent as x-api-key (maps to PLUGIN_AI_GATEWAY_API_KEY)"
      oneOf:
      - $ref: ../common/string-without-jexl.yaml
      - $ref: ../common/common-jexl.yaml
  anyOf:
  - required: [collectionName]
  - required: [runId]
