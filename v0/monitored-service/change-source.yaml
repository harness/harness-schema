type: object
title: ChangeSource
required:
  - identifier
  - name
  - type
properties:
  identifier:
    type: string
    pattern: "^[a-zA-Z_][0-9a-zA-Z_]{0,127}$"
  name:
    type: string
  enabled:
    type: boolean
  type:
    # NOTE: open string — documentation-only list; unknown types must not fail Monaco.
    type: string
  spec:
    type: object
  category:
    type: string
