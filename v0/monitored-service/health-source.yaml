type: object
title: HealthSource
required:
  - identifier
  - name
  - type
properties:
  identifier:
    type: string
    pattern: "^[a-zA-Z_][0-9a-zA-Z_]{0,127}$"
  name:
    type: string
  type:
    # NOTE: open string — enum values are documentation only. A new connector type added
    # to the UI before a schema PR lands must not produce Monaco red-squiggles.
    type: string
  spec:
    # NOTE: open object — per-family spec keys vary and grow independently of this schema.
    type: object
